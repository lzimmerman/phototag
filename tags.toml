[light]
enabled = true
low_key_max = 0.22         # mean brightness (0-1) at or below => Low key
high_key_min = 0.75        # mean brightness at or above => High key

[format]
enabled = true
panorama_min_ratio = 2.0   # long side / short side
square_max_ratio = 1.05

# -------------------------------------------------------------------- EXIF ---

[exif]
camera = true
lens = true
season = true
hemisphere = "north"       # used when a photo has no GPS position
time_of_day = true
golden_hour = true         # needs GPS + a known UTC time (GPS time or an offset tag)
place = true               # offline reverse geocoding of GPS positions
place_levels = ["country", "region", "city"]
long_exposure_s = 0.5      # exposure time (seconds) at or above => Long exposure
high_iso = 3200
flash = true

# Local clock hour at which each period starts (camera clock, so check that
# your cameras were set to local time).
time_of_day_starts = [[0, "Night"], [5, "Morning"], [11, "Midday"], [14, "Afternoon"], [18, "Evening"], [21, "Night"]]

# 35mm-equivalent focal length upper bounds (exclusive), in mm.
[exif.focal]
"Ultra-wide" = 21
"Wide" = 35
"Normal" = 70
"Short tele" = 135
"Telephoto" = 100000

# ---------------------------------------------------------- detection (YOLO) ---

[people]
enabled = true
min_conf = 0.65            # detector confidence; lower lets in flowers, comics and empty scenes
min_area = 0.002           # ignore people smaller than this fraction of the frame
portrait_area = 0.15       # 1-2 people and the largest covers this much => People|Portrait
small_figure_area = 0.03   # largest person smaller than this => People|Small figures
tag_none = false           # also tag photos with nobody in them as People|None
# The detector also "finds" people in flowers, insects, or a hand stroking a cat.
# People tags are kept only when the scene model rates the photo at least this
# likely to be of people, against the other descriptions in [people.check].
check_min_confidence = 0.5

[people.check]
"a photo of a person" = "People"
"a photo of people" = "People"
"a photo of a crowd" = "People"
"a portrait of a person" = "People"
"a photo of a person's hand" = "People"
"a photo of people far away" = "People"
"a photo of a person with a dog" = "People"
"a photo of a flower" = ""
"a photo of a plant" = ""
"a photo of a dog" = ""
"a photo of a cat" = ""
"a photo of a bird" = ""
"a photo of an insect" = ""
"a photo of a building" = ""
"a photo of a landscape" = ""
"a photo of a statue" = ""
"a photo of a mannequin" = ""
"a photo of an object" = ""

[objects]
enabled = true
min_conf = 0.5
min_area = 0.005

# COCO class name = tag. Remove lines you don't care about; see
# https://docs.ultralytics.com/datasets/detect/coco/ for the 80 class names.
[objects.classes]
dog = "Animals|Dog"
cat = "Animals|Cat"
bird = "Animals|Bird"
horse = "Animals|Horse"
sheep = "Animals|Farm animals"
cow = "Animals|Farm animals"
elephant = "Animals|Wild animals"
bear = "Animals|Wild animals"
zebra = "Animals|Wild animals"
giraffe = "Animals|Wild animals"
car = "Vehicles|Car"
motorcycle = "Vehicles|Motorcycle"
bicycle = "Vehicles|Bicycle"
bus = "Vehicles|Bus"
truck = "Vehicles|Truck"
train = "Vehicles|Train"
