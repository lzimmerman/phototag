[birds]
# Which bird, for photos tagged "Animals|Bird" (by the detector or the list
# above): the scene model picks the closest match here, if it's at least
# min_confidence sure; otherwise the photo just keeps "Animals|Bird". Several
# descriptions can share a tag (crow and raven, sandpiper and plover).
