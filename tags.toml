[not_photo]
# Screenshots, memes and comics saved alongside your photos. The scene model
# picks the closest description below; ones mapped to "" describe ordinary
# photos and mean no tag. Images that record no camera are usually not photos,
# so they need less confidence.
enabled = true
min_confidence = 0.9
min_confidence_no_camera = 0.4

[not_photo.kinds]
"a screenshot of a social media post" = "Not a photo|Screenshot"
"a screenshot of a phone screen" = "Not a photo|Screenshot"
"a screenshot of a news article" = "Not a photo|Screenshot"
"a screenshot of a text message conversation" = "Not a photo|Screenshot"
"a meme with text" = "Not a photo|Meme"
"an image macro meme with a caption" = "Not a photo|Meme"
"a poster or graphic design with text" = "Not a photo|Meme"
"a comic strip" = "Not a photo|Comic"
"a cartoon drawing" = "Not a photo|Comic"
"a digital illustration" = "Not a photo|Comic"
"a photograph" = ""
"a photo of nature" = ""
"a photo of a person" = ""
"a photo of an animal" = ""
"a photo of food" = ""
"a photo of the night sky" = ""
"a dark underexposed photo" = ""
"a blurry photo" = ""
"a photo of a building" = ""
