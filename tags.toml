# phototag configuration
#
# Edit freely, then re-run `python phototag.py tag` (fast, no rescanning) and
# `python phototag.py write` to update the sidecars.
# Changing [models] needs a rescan: `python phototag.py scan ROOT --rescan-ml`.
#
# Tag names use "|" for hierarchy. Don't use "/" in names (digiKam treats it
# as a hierarchy separator too).

# Every tag is written under this top-level tag, e.g. "Auto|Scene|Landscape".
# That keeps automatic tags apart from your own and makes them easy to hide
# or remove in digiKam.
root = "Auto"

[sidecar]
# "digikam"   -> IMG_0001.CR2.xmp  (digiKam's default naming)
# "lightroom" -> IMG_0001.xmp      (only if digiKam is set to "commercial" naming;
#                                   avoid with RAW+JPEG pairs, which would share one file)
style = "digikam"

[models]
# SigLIP image/text model (open_clip names). If this one isn't available in
# your open_clip version, phototag falls back to ViT-B-16-SigLIP / webli.
clip = "ViT-B-16-SigLIP2-256"
clip_pretrained = "webli"
# Ultralytics YOLO detector for people/animals/vehicles (downloads on first use).
yolo = "yolo11s.pt"
# "auto" picks Apple GPU (mps) when available, else cpu.
device = "auto"

# ---------------------------------------------------------------- computed ---

[color]
enabled = true
# Colour is measured on a 0-128 chroma scale (use `explain` to see a photo's values).
# "spread" = how far pixels stray from the photo's average colour. A B&W or
# toned image has almost none; JPEG noise adds a little.
bw_max_chroma = 7.0        # 99th-percentile spread below this => monochrome
toned_min_tint = 3.0       # monochrome with an average tint above this => "Toned" (sepia, selenium...)
toned_max_tint = 30.0      # stronger tints are single-colour subjects (blue sky), not toning

[film]
# Scanned colour negatives: the orange film base gives an even orange cast and no
# true black (the darkest parts of the scene come out as orange base). The scene
# tag "Film|Negative" below also finds black-and-white negatives and film strips;
# this rule catches the orange ones it misses. Both give the same tag.
enabled = true
negative_hue = [115, 145]       # orange (tint_hue in `explain`)
negative_min_tint = 20          # a strong overall cast...
negative_max_spread = 32        # ...that is nearly one colour (sunsets and flowers vary far more)
negative_max_dark = 0.15        # share of near-black pixels: rules out moons and silhouettes.
                                # Saved by Scan from Oct 2026; older scans skip this rule until rescanned.
# Black-and-white negatives: a black-and-white photo with almost no true black,
# not too dark overall (rules out grey night skies), that the scene model picks
# as a negative over the ordinary photos described in [film.bw_check].
bw_negative_max_dark = 0.03
bw_negative_min_brightness = 0.25
bw_negative_min_confidence = 0.5    # lower finds more, but more ordinary B&W photos too

[film.bw_check]
"a scanned black and white film negative" = "Film|Negative"
"an inverted black and white photo with white shadows" = "Film|Negative"
"a black and white negative strip with sprocket holes" = "Film|Negative"
"a black and white photograph" = ""
"a black and white macro photo" = ""
"a bright high key black and white photo" = ""
"a black and white photo of a landscape" = ""
"a black and white photo of a person" = ""
"a black and white photo of a building" = ""
"a bird flying in a grey sky" = ""
"a bird against an overcast sky" = ""
"a grey night sky" = ""

[animals]
# The detector (YOLO, under [objects]) finds animals but only knows ten kinds, so it
# calls a coyote a dog or a cow, and a squirrel a bear. When it finds an animal, the
# scene model picks the closest match from this list instead, if it's at least
# min_confidence sure (0-1); otherwise the detector's tag stays. Add any animal:
# "a <description>" = "<tag>". "" means no tag (e.g. for drawings of animals).
enabled = true
min_confidence = 0.8

[animals.species]
"a coyote" = "Animals|Wild animals|Coyote"
"a red fox" = "Animals|Wild animals|Fox"
"a wolf" = "Animals|Wild animals|Wolf"
"a deer" = "Animals|Wild animals|Deer"
